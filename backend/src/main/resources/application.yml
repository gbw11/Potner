spring:
  application:
    name: potner
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # potner.photo.max-upload-bytes 보다 크게 둔다. 이 값이 더 작으면 Spring 이 먼저 거부해
      # PHOTO_TOO_LARGE 대신 형식이 다른 일반 오류가 나가고 원인 파악이 어려워진다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: potner

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

potner:
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:potner-backend-local}
    topic: ${MQTT_TOPIC:potner/device/+/sensor/telemetry}
    qos: ${MQTT_QOS:1}
    connection-timeout-seconds: ${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
    keep-alive-seconds: ${MQTT_KEEP_ALIVE_SECONDS:60}
    recovery-interval-ms: ${MQTT_RECOVERY_INTERVAL_MS:10000}
    heartbeat:
      topic: ${MQTT_HEARTBEAT_TOPIC:potner/device/+/status/heartbeat}
      offline-timeout-seconds: ${MQTT_HEARTBEAT_OFFLINE_TIMEOUT_SECONDS:90}
      offline-check-interval-seconds: ${MQTT_HEARTBEAT_OFFLINE_CHECK_INTERVAL_SECONDS:30}
  daily-light:
    enabled: ${DAILY_LIGHT_ENABLED:true}
    cron: "${DAILY_LIGHT_CRON:0 0 2 * * *}"
    # @Scheduled 의 zone 은 TimeZone.getTimeZone 으로 해석되므로 맨 오프셋('+09:00')을 받지 않는다.
    # IANA 지역 ID 또는 'GMT+09:00' 형태여야 한다.
    # potner.sensor.zone-offset 과 같은 지역을 가리켜야 한다. 그쪽은 SQL 시각 연산에 쓰이므로 고정 오프셋이다.
    zone: "${DAILY_LIGHT_ZONE:Asia/Seoul}"
    light-on-threshold-lux: ${DAILY_LIGHT_ON_THRESHOLD_LUX:500}
    max-gap-seconds: ${DAILY_LIGHT_MAX_GAP_SECONDS:600}
    min-coverage-pct: ${DAILY_LIGHT_MIN_COVERAGE_PCT:80}
    photoperiod-tolerance-ratio: ${DAILY_LIGHT_PHOTOPERIOD_TOLERANCE_RATIO:0.2}
    max-history-days: ${DAILY_LIGHT_MAX_HISTORY_DAYS:90}
  alert:
    sample-size: ${ALERT_SAMPLE_SIZE:3}
    hysteresis-ratio: ${ALERT_HYSTERESIS_RATIO:0.1}
    max-page-size: ${ALERT_MAX_PAGE_SIZE:100}
  photo:
    # 배포 sync 경로 밖의 named volume 이어야 한다. 배포 파이프라인이 배포 디렉토리를 매번
    # 덮어쓰므로 그 안에 두면 배포마다 사진이 사라진다. docker compose down -v 도 이 볼륨을 지운다.
    root: ${PHOTO_ROOT:./data/photos}
    # Nginx 가 root 를 이 경로로 공개한다. DB 에는 상대 경로만 저장하므로 도메인이 바뀌어도
    # 이 값만 고치면 된다.
    base-url: ${PHOTO_BASE_URL:http://localhost:8080/media}
    playback-max-pixels: ${PHOTO_PLAYBACK_MAX_PIXELS:1280}
    thumbnail-max-pixels: ${PHOTO_THUMBNAIL_MAX_PIXELS:400}
    max-upload-bytes: ${PHOTO_MAX_UPLOAD_BYTES:10485760}
  sensor:
    zone-offset: "${SENSOR_ZONE_OFFSET:+09:00}"
    freshness-threshold-minutes: ${SENSOR_FRESHNESS_THRESHOLD_MINUTES:15}
    max-hour-interval-days: ${SENSOR_MAX_HOUR_INTERVAL_DAYS:14}
    max-day-interval-days: ${SENSOR_MAX_DAY_INTERVAL_DAYS:365}
