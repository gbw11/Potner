spring:
  application:
    name: potner
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # potner.photo.max-upload-bytes 보다 크게 둔다. 이 값이 더 작으면 Spring 이 먼저 거부해
      # PHOTO_TOO_LARGE 대신 형식이 다른 일반 오류가 나가고 원인 파악이 어려워진다.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: potner

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

potner:
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    client-id: ${MQTT_CLIENT_ID:potner-backend-local}
    topic: ${MQTT_TOPIC:potner/device/+/sensor/telemetry}
    qos: ${MQTT_QOS:1}
    connection-timeout-seconds: ${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
    keep-alive-seconds: ${MQTT_KEEP_ALIVE_SECONDS:60}
    recovery-interval-ms: ${MQTT_RECOVERY_INTERVAL_MS:10000}
    heartbeat:
      topic: ${MQTT_HEARTBEAT_TOPIC:potner/device/+/status/heartbeat}
      offline-timeout-seconds: ${MQTT_HEARTBEAT_OFFLINE_TIMEOUT_SECONDS:90}
      offline-check-interval-seconds: ${MQTT_HEARTBEAT_OFFLINE_CHECK_INTERVAL_SECONDS:30}
    # 서버 → 로봇 명령이다. 수신 토픽과 접두사를 맞추고 command/ 아래로 모은다.
    # {deviceUid} 와 {command} 는 발행할 때 치환한다.
    command:
      topic-template: ${MQTT_COMMAND_TOPIC_TEMPLATE:potner/device/{deviceUid}/command/{command}}
      # 구독 클라이언트와 ID 가 같으면 브로커가 앞선 세션을 끊는다. 둘이 서로를 끊으며 무한
      # 재접속에 빠져 센서 수집까지 멈추므로 접미사로 갈라 둔다.
      client-id-suffix: ${MQTT_COMMAND_CLIENT_ID_SUFFIX:-command}
      qos: ${MQTT_COMMAND_QOS:1}
  daily-light:
    enabled: ${DAILY_LIGHT_ENABLED:true}
    cron: "${DAILY_LIGHT_CRON:0 0 2 * * *}"
    # @Scheduled 의 zone 은 TimeZone.getTimeZone 으로 해석되므로 맨 오프셋('+09:00')을 받지 않는다.
    # IANA 지역 ID 또는 'GMT+09:00' 형태여야 한다.
    # potner.sensor.zone-offset 과 같은 지역을 가리켜야 한다. 그쪽은 SQL 시각 연산에 쓰이므로 고정 오프셋이다.
    zone: "${DAILY_LIGHT_ZONE:Asia/Seoul}"
    light-on-threshold-lux: ${DAILY_LIGHT_ON_THRESHOLD_LUX:500}
    max-gap-seconds: ${DAILY_LIGHT_MAX_GAP_SECONDS:600}
    min-coverage-pct: ${DAILY_LIGHT_MIN_COVERAGE_PCT:80}
    photoperiod-tolerance-ratio: ${DAILY_LIGHT_PHOTOPERIOD_TOLERANCE_RATIO:0.2}
    max-history-days: ${DAILY_LIGHT_MAX_HISTORY_DAYS:90}
  happiness:
    # 로봇 디스플레이 표정 발행. 브로커가 꺼져 있으면 발행기가 no-op 으로 떨어지므로 이 값을
    # 끄지 않아도 되지만, 판정 로그까지 끄고 싶을 때 쓴다.
    publish-enabled: ${HAPPINESS_PUBLISH_ENABLED:true}
    publish-interval-seconds: ${HAPPINESS_PUBLISH_INTERVAL_SECONDS:30}
    # 목표 조도(illuminance_target_lux)의 이 비율을 넘으면 '충분한 광량'으로 본다.
    # 목표값을 그대로 쓰면 안 된다. 시드가 야외 기준(바질 발아기 10,000 lux)이라 실내에서는
    # 창가라도 못 넘어 표정이 영영 나오지 않는다. 형광등은 300~500 lux 라 절반 기준으로도
    # 넘지 못하므로 실내등을 햇볕으로 오인하지 않는다. 시연 장소 밝기에 맞춰 조절한다.
    sunlight-lux-ratio: ${HAPPINESS_SUNLIGHT_LUX_RATIO:0.5}
    # 디스플레이가 달린 장치다. 하드웨어 구성이 바뀌면 RASPBERRY_PI 로 돌릴 수 있다.
    display-device-type: ${HAPPINESS_DISPLAY_DEVICE_TYPE:JETSON_ORIN}
  alert:
    sample-size: ${ALERT_SAMPLE_SIZE:3}
    hysteresis-ratio: ${ALERT_HYSTERESIS_RATIO:0.1}
    max-page-size: ${ALERT_MAX_PAGE_SIZE:100}
  photo:
    # 배포 sync 경로 밖의 named volume 이어야 한다. 배포 파이프라인이 배포 디렉토리를 매번
    # 덮어쓰므로 그 안에 두면 배포마다 사진이 사라진다. docker compose down -v 도 이 볼륨을 지운다.
    root: ${PHOTO_ROOT:./data/photos}
    # Nginx 가 root 를 이 경로로 공개한다. 기본값이 절대 URL 이 아닌 이유는 사진이 API 와 같은
    # origin 에서 나가기 때문이다. 앱이 자기 API base URL 에 붙이면 되므로 서버가 도메인을
    # 알 필요가 없고, 배포마다 주입할 값도 없다. 다른 origin 으로 옮길 때만 덮어쓴다.
    base-url: ${PHOTO_BASE_URL:/media}
    playback-max-pixels: ${PHOTO_PLAYBACK_MAX_PIXELS:1280}
    thumbnail-max-pixels: ${PHOTO_THUMBNAIL_MAX_PIXELS:400}
    max-upload-bytes: ${PHOTO_MAX_UPLOAD_BYTES:10485760}
  push:
    # 비어 있으면 발송기가 no-op 으로 떨어진다. 기능을 끄는 플래그를 따로 두지 않는 이유는
    # CI 임시 컨테이너에 Firebase 키가 없기 때문이다. 초기화가 예외를 던지면 Health Check 가
    # 실패해 배포 자체가 막히므로, 구현만 갈아끼우고 발송 경로는 항상 살려 둔다.
    # 배포 디렉토리 안을 가리키면 안 된다. Sync Deploy Configs 가 매 배포마다 덮어쓰는 경로다.
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
    core-pool-size: ${PUSH_CORE_POOL_SIZE:2}
    max-pool-size: ${PUSH_MAX_POOL_SIZE:4}
    # 넘치면 발송을 버린다. 센서 수집 스레드를 막지 않기 위한 상한이다.
    queue-capacity: ${PUSH_QUEUE_CAPACITY:200}
  diary:
    enabled: ${DIARY_ENABLED:true}
    # 하루를 마무리하는 시각에 그날 일기를 쓴다. 사용자가 자기 전에 읽는 흐름이다.
    #
    # 그 대가로 광량 판정이 일기에 들어가지 않는다. 누적 광량은 하루가 끝나야 확정되어
    # 새벽 2시 배치가 전일분을 집계하므로, 오늘 것은 이 시각에 아직 없다.
    # 알림과 사진은 그날 것이 이미 있어 그대로 쓰인다.
    cron: "${DIARY_CRON:0 0 21 * * *}"
    # @Scheduled 의 zone 은 맨 오프셋을 받지 않는다. IANA 지역 ID 여야 하며
    # 잘못 넣으면 애플리케이션이 시작하지 않는다. potner.daily-light.zone 과 같은 제약이다.
    zone: "${DIARY_ZONE:Asia/Seoul}"
  llm:
    # SSAFY GMS 는 OpenAI API 앞에 붙은 프록시라 요청·응답 형식이 OpenAI 와 같다.
    # 라즈베리 수집기도 같은 엔드포인트를 쓴다.
    base-url: ${LLM_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
    # 비어 있으면 no-op 으로 떨어진다. 기능을 끄는 플래그를 두지 않는 이유는 푸시와 같다.
    # 임시 CI 컨테이너에는 키가 없고, 초기화가 예외를 던지면 배포가 막힌다.
    api-key: ${LLM_API_KEY:}
    # 모델을 바꾸면 GmsChatClient 의 max_tokens 파라미터 이름도 확인해야 한다.
    # o 시리즈나 gpt-5 계열은 max_completion_tokens 를 쓴다.
    model: ${LLM_MODEL:gpt-4.1-mini}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:500}
    connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:5}
    # 하루 한 번 도는 배치가 다음 날까지 묶여 있으면 스케줄러가 겹친다.
    read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:30}
  sensor:
    zone-offset: "${SENSOR_ZONE_OFFSET:+09:00}"
    freshness-threshold-minutes: ${SENSOR_FRESHNESS_THRESHOLD_MINUTES:15}
    max-hour-interval-days: ${SENSOR_MAX_HOUR_INTERVAL_DAYS:14}
    max-day-interval-days: ${SENSOR_MAX_DAY_INTERVAL_DAYS:365}
