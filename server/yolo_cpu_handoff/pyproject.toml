[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-cpu-handoff"
version = "0.1.0"
description = "CPU-only YOLO inference handoff package"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "Pillow>=10.2,<12",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "ultralytics>=8.4.104,<9",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: opt-in integration tests that load real model artifacts",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["models*"]
