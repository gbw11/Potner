map $http_x_request_id $potner_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    # 사진 업로드 본문 한도다. 적지 않으면 Nginx 기본값 1MB 가 걸린다.
    #
    # 그러면 backend 의 multipart 한도(12MB)는 도달할 수 없는 값이 되고, 1MB 를 넘는 사진은
    # 애플리케이션에 닿기도 전에 413 으로 끊긴다. 서버 로그에는 아무것도 남지 않아 장치 쪽에서
    # 원인을 보기 어렵다 — 젯슨이 찍는 사진은 대부분 1MB 를 넘는다.
    #
    # backend 의 MULTIPART_MAX_REQUEST_SIZE 와 같은 값을 유지해야 한다. 둘 중 작은 쪽이
    # 실제 한도가 되므로 어긋나면 한쪽 설정이 조용히 무의미해진다.
    client_max_body_size 12m;

    location ~ ^/actuator/(env|configprops|beans)(/|$) {
        return 404;
    }

    # 성장 사진. backend 를 거치지 않고 정적으로 서빙한다.
    #
    # 이 경로에는 인증이 걸리지 않는다. 경로의 UUID 두 개가 추측을 막는 유일한 방어선이므로
    # backend 가 쓰는 레이아웃과 정확히 일치하는 요청만 통과시킨다. 그 밖의 경로는 아래
    # location /media/ 가 404 로 막으므로 디렉터리 목록도, 예상 밖의 파일도 노출되지 않는다.
    #
    # 레이아웃은 PhotoStorage 가 정한다: {plantId}/{photoId}/{original|playback|thumbnail}.jpg
    # 그쪽을 바꾸면 이 정규식도 함께 고쳐야 한다.
    location ~ "^/media/(?<potner_photo_path>[0-9a-fA-F-]{36}/[0-9a-fA-F-]{36}/(?:original|playback|thumbnail)\.jpg)$" {
        alias /var/potner/photos/$potner_photo_path;

        # URL 하나가 늘 같은 사진을 가리킨다. photoId 가 UUID 라 내용이 바뀌지 않는다.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 이미지 요청에는 본문이 없다.
        limit_except GET HEAD {
            deny all;
        }
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $potner_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
