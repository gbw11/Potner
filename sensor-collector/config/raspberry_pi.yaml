# Pi 실행 예:
#   python main.py --config config/raspberry_pi.yaml
#   python -m cli.plant --config config/raspberry_pi.yaml brief
platform: raspberry_pi

interval_sec: 5

storage:
  type: csv
  path: data/readings.csv

i2c_bus: 1

sensors:
  light:
    enabled: true
    driver: bh1750
    address: 0x23

  climate:
    enabled: true
    driver: iio   # iio (dtoverlay dht11) | dht22 | dht11 | aht20 | mock
    pin: 4
    address: 0x38
    device_path: /sys/bus/iio/devices/iio:device0

  soil:
    enabled: true
    driver: ads1115
    address: 0x48
    channel: 0
    dry_raw: 20000
    wet_raw: 8000

status_rules:
  soil_moisture_pct:
    low: 30
    high: 80
  temperature_c:
    low: 15
    high: 32
  humidity_pct:
    low: 30
    high: 80
  light_lux:
    low: 100
    high: 5000

backend:
  enabled: false
  base_url: http://127.0.0.1:8080
  soil_path: /api/v1/sensors/soil
  device_id: auto
  timeout_sec: 5

events:
  path: data/events.jsonl

llm:
  enabled: true
  provider: gms
  model: gpt-4.1-nano
  max_tokens: 200
  api_key_env: OPENAI_API_KEY
  base_url: https://gms.ssafy.io/gmsapi/api.openai.com/v1

voice:
  tts: console
  stt: console

camera:
  enabled: false
  driver: picamera2
  path: data/camera
  width: 1920
  height: 1080
  camera_num: 0
  settle_sec: 1.0
  exposure_value: 1.0
  brightness: 0.12
  contrast: 1.1
  saturation: 1.05
  capture_with_read: false
  capture_every_n: 1

# Spring 백엔드로 온습도 JSON POST
spring:
  enabled: false
  url: http://127.0.0.1:18080/api/sensors/climate

# potner MQTT (SSAFY 브로커)
# main.py 가 interval_sec(5초) 마다 센서값만 송신 (상태 문구/heartbeat 없음)
# device_id: auto → Pi 보드 시리얼. 브로커 ACL용 토픽은 아래 telemetry_topic 유지.
# password 는 가능하면 환경변수 MQTT_PASSWORD 로 두고, yaml 에는 넣지 마세요.
mqtt:
  enabled: true
  host: i15e104.p.ssafy.io
  port: 1884
  qos: 1
  device_id: auto
  username: raspberry-01
  password: ""  # set via MQTT_PASSWORD env
  telemetry_topic: potner/device/raspberry-01/sensor/telemetry

