# Copy over config.yaml on the Pi, or run:
#   python main.py --config config.raspberry_pi.yaml
#   python -m cli.plant --config config.raspberry_pi.yaml brief
platform: raspberry_pi

interval_sec: 5

storage:
  type: csv
  path: data/readings.csv

i2c_bus: 1

sensors:
  light:
    enabled: true
    driver: bh1750
    address: 0x23

  climate:
    enabled: true
    driver: dht22   # dht22 | dht11 | aht20 | mock
    pin: 4
    address: 0x38

  soil:
    enabled: true
    driver: ads1115
    address: 0x48
    channel: 0
    dry_raw: 20000
    wet_raw: 8000

status_rules:
  soil_moisture_pct:
    low: 30
    high: 80
  temperature_c:
    low: 15
    high: 32
  humidity_pct:
    low: 30
    high: 80
  light_lux:
    low: 100
    high: 5000

backend:
  enabled: true
  base_url: http://127.0.0.1:8080
  soil_path: /api/v1/sensors/soil
  device_id: pi-01
  timeout_sec: 5

events:
  path: data/events.jsonl

llm:
  enabled: true
  provider: gms
  model: gpt-4.1-nano
  max_tokens: 200
  api_key_env: OPENAI_API_KEY
  base_url: https://gms.ssafy.io/gmsapi/api.openai.com/v1

voice:
  tts: console
  stt: console

camera:
  enabled: true
  driver: picamera2
  path: data/camera
  width: 1920
  height: 1080
  camera_num: 0
  settle_sec: 1.0
  exposure_value: 1.0
  brightness: 0.12
  contrast: 1.1
  saturation: 1.05
  capture_with_read: false
  capture_every_n: 1
