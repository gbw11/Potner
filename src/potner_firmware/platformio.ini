; Potner 저수준 컨트롤러 펌웨어 (ESP32 DevKit V1 / DevKitC V4 공용)
;
; ROS 2 패키지가 아닙니다. colcon 이 이 폴더를 건드리지 않도록
; COLCON_IGNORE 파일을 같이 두었습니다.
;
; 빌드 및 업로드:
;   pip install platformio
;   cd src/potner_firmware
;   pio run --target upload
;   pio device monitor -b 115200

[env:esp32]
platform = espressif32
; 범용 "ESP32 Dev Module". DOIT DevKit V1 과 Espressif DevKitC V4 둘 다
; ESP32-WROOM-32 / 4MB 플래시라 이 정의로 함께 올라갑니다.
; ★ ESP32-S3 는 다른 칩입니다. GPIO 34~39 가 없어서 엔코더 핀을 전부
;   다시 잡아야 하므로 이 설정으로 쓰면 안 됩니다.
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    madhephaestus/ESP32Encoder@^0.10.2

build_flags =
    -Wall
